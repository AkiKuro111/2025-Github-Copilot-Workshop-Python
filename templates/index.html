<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <h1>ポモドーロタイマー</h1>
    <div id="timer-container">
        <div id="progress-wrapper">
            <svg id="progress-circle" width="200" height="200">
                <circle cx="100" cy="100" r="90" stroke="#e5e6ef" stroke-width="16" fill="none" />
                <circle id="progress-bar" cx="100" cy="100" r="90" stroke="#7b6cf6" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="565.48" stroke-dashoffset="0"/>
            </svg>
            <div id="timer-display">25:00</div>
        </div>
        <div id="timer-buttons">
            <button id="start-btn">開始</button>
            <button id="reset-btn">リセット</button>
        </div>
    </div>

    <div id="progress-summary">
        <div class="summary-title">今日の進捗</div>
        <div class="summary-content">
            <div class="summary-item">
                <div class="summary-value" id="completed-count">4</div>
                <div class="summary-label">完了</div>
            </div>
            <div class="summary-item">
                <div class="summary-value" id="focus-time">1時間40分</div>
                <div class="summary-label">集中時間</div>
            </div>
        </div>
    </div>
    <script src="/static/js/timer.js"></script>
</body>
</html>
